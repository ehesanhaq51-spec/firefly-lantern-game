<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>হেরিকেন ও জোনাকির জঙ্গল</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      background: #070b10;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 10px;
    }
    .hud {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 15px;
      gap: 10px;
      flex-wrap: wrap;
    }
    canvas {
      width: 100%;
      max-width: 820px;
      height: 440px;
      background: #090d14;
      border: 1px solid #1f2937;
      border-radius: 12px;
      display: block;
    }
    .controls {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    button.ctrl-btn {
      background: #1f2937;
      color: #fff;
      border: 1px solid #374151;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.ctrl-btn:active,
    button.ctrl-btn.active {
      background: #d97706;
      border-color: #f59e0b;
      color: #111827;
      font-weight: 700;
    }
    .hint {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      max-width: 820px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>লেভেল: <strong id="levelText">1</strong></div>
    <div>হেরিকেনের আলো: <strong id="lightText">0.0s</strong></div>
    <div>গ্রামের দূরত্ব: <strong id="distText">0m</strong></div>
    <div>অবস্থা: <strong id="statusText">জোনাকি ধরো!</strong></div>
  </div>

  <canvas id="gameCanvas" width="820" height="440"></canvas>

  <div class="controls">
    <button id="backBtn" class="ctrl-btn">⬅️ পেছনে</button>
    <button id="walkBtn" class="ctrl-btn">🚶 হাঁটো</button>
    <button id="runBtn" class="ctrl-btn">🏃 দৌড়াও</button>
    <button id="restartBtn" class="ctrl-btn">🔄 আবার শুরু</button>
  </div>

  <div class="hint">
    জোনাকির কাছে গেলেই বাচ্চা নিজে থেকে ধরে হেরিকেনে ভরে নেবে (একটা জোনাকিতে ১৫ সেকেন্ড আলো)। আলো নিভে গেলে রাতের বিপদ হামলা করবে! কিবোর্ডে <b>A / D</b> বা <b>← / →</b> এবং <b>Shift</b> দিয়েও খেলতে পারো।
  </div>

  <script src="game.js"></script>
</body>
</html>
